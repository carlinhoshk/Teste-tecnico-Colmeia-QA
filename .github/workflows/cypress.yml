name: Cypress E2E Tests

on:
  push:
    branches: [main, CI]
  pull_request:
    branches: [main, CI]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes Cypress
        id: cypress
        # O 'tee' garante que o log apareça no console e seja salvo no arquivo ao mesmo tempo
        run: npx cypress run | tee cypress.log
        continue-on-error: true

      - name: Criar issue se testes falharem
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logContent = 'Log não encontrado.';
            
            if (fs.existsSync('cypress.log')) {
              const fullLog = fs.readFileSync('cypress.log', 'utf8');
              // Remove caracteres especiais de cores do terminal para o log ficar limpo
              const cleanLog = fullLog.replace(/[\u001b\u009b][[()#;?]*(?:[a-zA-Z\d]*(?:;[-a-zA-Z\d\/#&.:=?%@~_]*)*)?\u0007/g, '');
              
              // Pega apenas os últimos 2000 caracteres (onde geralmente estão os detalhes do erro)
              logContent = cleanLog.length > 2000 ? '...' + cleanLog.slice(-2000) : cleanLog;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'qa,bug'
            });

            const title = `Falha nos testes E2E — ${new Date().toISOString().split('T')[0]}`;
            const jaExiste = issues.some(i => i.title.includes('Falha nos testes E2E'));
            
            if (jaExiste) {
              console.log('Issue já está aberta. Pulando criação.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## ❌ Falha nos Testes E2E\n\n` +
                    `**Branch:** \`${context.ref}\`\n` +
                    `**Commit:** \`${context.sha}\`\n\n` +
                    `### 📄 Resumo do Erro (Console):\n` +
                    `\`\`\`text\n${logContent}\n\`\`\`\n\n` +
                    `**Acesse o log completo em:** [GitHub Actions Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: |
          echo "Os testes falharam. Forçando erro no Job para marcar como falho."
          exit 1
