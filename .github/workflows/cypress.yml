name: Cypress E2E Tests

on:
  push:
    branches: [CI]
  pull_request:
    branches: [CI]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes Cypress
        id: cypress
        run: npx cypress run 2>&1 | tee cypress-output.txt
        continue-on-error: true

      - name: Criar issue com detalhes do erro
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // ─── Extrai Esperado/Obtido do codigo fonte ────────────────
            function extractDetails(testName) {
              const e2eDir = 'cypress/e2e';
              if (!fs.existsSync(e2eDir)) return {};
              const files = fs.readdirSync(e2eDir).filter(f => f.endsWith('.cy.js'));
              const ctMatch = testName.match(/(CT\d+)\s-\s(.+)/);
              if (!ctMatch) return {};
              const ctId = ctMatch[1];
              const descSnippet = ctMatch[2].substring(0, 25);

              for (const file of files) {
                const content = fs.readFileSync(path.join(e2eDir, file), 'utf8');
                const sourceLines = content.split('\n');
                for (let i = 0; i < sourceLines.length; i++) {
                  const line = sourceLines[i];
                  if (line.includes(`'${ctId} -`) && line.includes(descSnippet)) {
                    let expected = '', obtained = '', description = '';
                    let jsdocLines = [];
                    for (let j = i - 1; j >= Math.max(0, i - 20); j--) {
                      const l = sourceLines[j].trim();
                      if (l.startsWith('*') && !l.startsWith('/**') && !l.startsWith('*/') && !l.startsWith('//')) {
                        jsdocLines.unshift(l.replace(/^\*\s?/, ''));
                      } else if (l.includes("it('") || l.includes('it("'))) {
                        break;
                      }
                    }
                    if (jsdocLines.length) description = jsdocLines.join(' ');
                    for (let j = i + 1; j < Math.min(sourceLines.length, i + 20); j++) {
                      const l = sourceLines[j].trim();
                      if (l.startsWith('// Esperado:')) expected = l.replace('// Esperado: ', '');
                      else if (l.startsWith('// Obtido:')) obtained = l.replace('// Obtido: ', '');
                      else if (!description && l.startsWith('// BUG-')) description = l.replace('// ', '');
                    }
                    return { expected, obtained, description, file };
                  }
                }
              }
              return {};
            }

            // ─── Parseia output do Cypress ─────────────────────────────
            const failedTests = [];
            const errorMessages = [];

            if (fs.existsSync('cypress-output.txt')) {
              const raw = fs.readFileSync('cypress-output.txt', 'utf8')
                .replace(/\u001b\[.*?m/g, '');
              const lines = raw.split('\n');

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (/^\s{4}\d+\)\s/.test(line)) {
                  failedTests.push(line.trim());
                  continue;
                }
                if (/^\s{5,}(CypressError|AssertionError|Timed out)/.test(line)) {
                  const msg = line.trim();
                  if (!errorMessages.includes(msg)) errorMessages.push(msg);
                }
              }
            }

            // ─── Evita duplicata ───────────────────────────────────────
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'qa,bug'
            });

            if (issues.some(i => i.title.includes('Falha nos testes E2E'))) return;

            // ─── Monta body ────────────────────────────────────────────
            const body = [
              '## ❌ Testes E2E falharam\n',
              `**Branch:** ${context.ref}`,
              `**Commit:** ${context.sha}`,
              '',
              '---',
            ];

            for (let i = 0; i < failedTests.length; i++) {
              const t = failedTests[i];
              const err = errorMessages[i] || '';
              const det = extractDetails(t);

              body.push(`\n### ${t}`);
              if (det.expected) body.push(`\n- **Esperado:** ${det.expected}`);
              if (det.obtained) body.push(`\n- **Obtido:** ${det.obtained}`);
              if (det.description) body.push(`\n- *${det.description}*`);
              body.push('\n```\n' + err + '\n```');
            }

            body.push(
              '',
              '---',
              `📎 Log completo: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Issue gerada automaticamente pelo CI._'
            );

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha nos testes E2E — ${new Date().toISOString().split('T')[0]}`,
              body: body.join('\n'),
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: exit 1
