name: Cypress E2E Tests

on:
  push:
    branches: [main, CI]
  pull_request:
    branches: [main, CI]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes Cypress
        id: cypress
        continue-on-error: true
        run: |
          npx cypress run 2>&1 | tee cypress.log

      - name: Upload screenshots e vídeos
        if: steps.cypress.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-${{ github.run_id }}
          path: |
            cypress/screenshots/
            cypress/videos/
            cypress.log

      - name: Criar issue com detalhes do erro
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Lê e limpa o log do Cypress (remove caracteres ANSI de cor)
            const raw = fs.existsSync('cypress.log')
              ? fs.readFileSync('cypress.log', 'utf8').replace(/\u001b\[.*?m/g, '')
              : '';
            const lines = raw.split('\n');

            // Extrai os testes que falharam e suas mensagens de erro
            const failedTests = [];
            const errorMessages = [];
            let capturing = false;

            for (const line of lines) {
              if (line.match(/^\s+[✗×]/)) {
                failedTests.push(line.trim());
                capturing = true;
              } else if (capturing) {
                if (line.trim() && line.startsWith('      ')) {
                  errorMessages.push(line.trim());
                } else {
                  capturing = false;
                }
              }
            }

            // Extrai o resumo (passing / failing / duration)
            const summary = lines
              .filter(l => l.match(/(Tests|Passing|Failing|Pending|Duration|Screenshots):/))
              .map(l => l.trim());

            // Nome da branch (funciona tanto em push quanto em PR)
            const branch = context.payload.pull_request
              ? context.payload.pull_request.head.ref
              : context.ref.replace('refs/heads/', '');

            const date = new Date().toISOString().split('T')[0];
            const title = `[CI] Falha nos testes E2E — ${date} (${branch})`;

            // Evita abrir issue duplicada no mesmo dia
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,qa'
            });

            if (issues.some(i => i.title.includes(date))) {
              console.log('Issue já existe para hoje. Pulando criação.');
              return;
            }

            // Monta o body da issue
            const body = [
              '## ❌ Falha nos Testes Cypress\n',
              `**Branch:** \`${branch}\``,
              `**Commit:** \`${context.sha}\``,
              `**Data:** ${new Date().toLocaleString('pt-BR')}`,
              '',
              '---',
            ];

            if (failedTests.length) {
              body.push(`\n### 🧪 Testes com falha (${failedTests.length})`);
              body.push('```');
              body.push(...failedTests);
              body.push('```');
            }

            if (errorMessages.length) {
              body.push('\n### ⚠️ Mensagens de erro');
              body.push('```');
              body.push(...errorMessages.slice(0, 30));
              body.push('```');
            }

            if (summary.length) {
              body.push('\n### 📊 Resumo');
              body.push('```');
              body.push(...summary);
              body.push('```');
            }

            body.push(
              '',
              '---',
              `📎 Screenshots, vídeos e log completo: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Issue gerada automaticamente pelo CI._'
            );

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body.join('\n'),
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: |
          echo "Os testes falharam. Forçando erro no Job para marcar como falho."
          exit 1
