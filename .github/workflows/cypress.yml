name: Cypress E2E Tests

on:
  push:
    branches: [main, CI]
  pull_request:
    branches: [main, CI]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes Cypress
        id: cypress
        run: npx cypress run
        continue-on-error: true

      - name: Upload screenshots
        if: steps.cypress.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Mover screenshots para pasta pública
        if: steps.cypress.outcome == 'failure'
        run: |
          mkdir -p screenshots-ci
          cp -r cypress/screenshots/* screenshots-ci/ || true

      - name: Commit screenshots no repositório
        if: steps.cypress.outcome == 'failure'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add screenshots-ci/
          git commit -m "ci: screenshots da falha $(date +%Y-%m-%d)" || true
          git push

      - name: Criar issue com imagem inline
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const screenshotsDir = 'screenshots-ci';
            let imageLinks = '';

            if (fs.existsSync(screenshotsDir)) {
              const files = fs.readdirSync(screenshotsDir, { recursive: true })
                .filter(f => typeof f === 'string' && f.endsWith('.png'));

              imageLinks = files.map(f => {
                const encoded = f.split('/').map(encodeURIComponent).join('/');
                const url = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.ref.replace('refs/heads/', '')}/screenshots-ci/${encoded}`;
                return `![${f}](${url})`;
              }).join('\n\n');
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'qa,bug'
            });

            const jaExiste = issues.some(i => i.title.includes('Falha nos testes E2E'));
            if (jaExiste) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha nos testes E2E — ${new Date().toISOString().split('T')[0]}`,
              body: `## Testes E2E falharam\n\n**Branch:** ${context.ref}\n**Commit:** ${context.sha}\n\n### Testes com falha\n\n${imageLinks}\n\n### O que fazer\n1. Veja as imagens acima\n2. Corrija o bug ou marque o teste como \`skip\` com justificativa`,
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: exit 1