name: Cypress E2E Tests

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main, ci]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes Cypress
        id: cypress
        run: npx cypress run --reporter json > cypress-results.json 2>/dev/null
        continue-on-error: true

      - name: Criar issue com detalhes do erro
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const failedTests = [];
            const errorMessages = [];

            if (fs.existsSync('cypress-results.json')) {
              const raw = fs.readFileSync('cypress-results.json', 'utf8')
                .replace(/\u001b\[.*?m/g, '');

              // Cada spec produz um JSON object por linha
              const lines = raw.split('\n').filter(l => l.trim());

              for (const line of lines) {
                try {
                  const spec = JSON.parse(line);
                  const tests = spec.tests || [];

                  for (const test of tests) {
                    if (test.state === 'failed') {
                      const title = Array.isArray(test.title)
                        ? test.title.join(' > ')
                        : test.title;

                      const errMsg = test.displayError
                        || test.err?.message
                        || 'Sem mensagem de erro';

                      failedTests.push(`- ❌ **${title}**`);
                      errorMessages.push(errMsg.split('\n')[0]);
                    }
                  }
                } catch (_) {
                  // Linha não-JSON (ex: Cypress pode incluir warnings)
                }
              }
            }

            // Evita abrir issue duplicada
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,qa'
            });

            const date = new Date().toISOString().split('T')[0];
            const title = `Falha nos testes E2E — ${date}`;

            if (issues.some(i => i.title.includes('Falha nos testes E2E'))) {
              console.log('Issue já existe. Pulando criação.');
              return;
            }

            // Monta body
            const body = [
              '## ❌ Testes E2E falharam\n',
              `**Branch:** ${context.ref}`,
              `**Commit:** ${context.sha}`,
              '',
              '---',
            ];

            if (failedTests.length) {
              body.push('\n### Testes com falha');
              body.push(...failedTests);
            } else {
              body.push('\n> Não foi possível extrair detalhes dos testes.');
            }

            if (errorMessages.length) {
              body.push('\n### Mensagens de erro');
              body.push('```');
              body.push(...errorMessages.slice(0, 20));
              body.push('```');
            }

            body.push(
              '',
              '---',
              `📎 Log completo: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Issue gerada automaticamente pelo CI._'
            );

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body.join('\n'),
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: exit 1
