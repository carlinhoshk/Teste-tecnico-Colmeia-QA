name: Cypress E2E Tests

on:
  push:
    branches: [main, CI]
  pull_request:
    branches: [main, ci]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes Cypress
        id: cypress
        # Redireciona a saída para um arquivo para ser lida depois
        run: npx cypress run | tee cypress-output.txt
        continue-on-error: true

      - name: Criar issue com logs de erro
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logs = 'Não foi possível carregar os logs.';
            
            if (fs.existsSync('cypress-output.txt')) {
              const fullLog = fs.readFileSync('cypress-output.txt', 'utf8');
              // Tenta pegar a parte do log que contém as falhas (geralmente após o sumário)
              // Ou simplesmente limita o tamanho para não estourar o limite da Issue (65k chars)
              logs = fullLog.length > 60000 ? fullLog.substring(fullLog.length - 60000) : fullLog;
            }

            const title = `Falha nos testes E2E — ${new Date().toISOString().split('T')[0]}`;
            
            // Verifica se já existe uma issue aberta com esse título para evitar duplicatas
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,qa'
            });

            if (issues.some(i => i.title.includes('Falha nos testes E2E'))) {
              console.log('Já existe uma issue aberta para esta falha.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## ❌ Falha detectada nos testes E2E\n\n` +
                    `**Branch:** \`${context.ref}\`\n` +
                    `**Workflow:** [Visualizar Execução](${context.payload.repository.html_url}/actions/runs/${context.runId})\n\n` +
                    `### 📋 Logs de Erro\n` +
                    `\`\`\`text\n${logs}\n\`\`\`\n\n` +
                    `--- \n *Gerado automaticamente via GitHub Actions*`,
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: exit 1
