name: Cypress E2E Tests

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main, ci]

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes Cypress
        id: cypress
        run: npx cypress run --reporter json > cypress-results.json 2>&1
        continue-on-error: true

      - name: Debug - exibir resultado bruto
        if: steps.cypress.outcome == 'failure'
        run: |
          echo "=== INÍCIO DO JSON ==="
          head -c 5000 cypress-results.json
          echo ""
          echo "=== FIM DO JSON ==="
          echo "Tamanho do arquivo: $(wc -c < cypress-results.json) bytes"
          echo "Linhas no arquivo: $(wc -l < cypress-results.json)"

      - name: Criar issue com detalhes do erro
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // ─── Extrair objetos JSON completos do arquivo ───────────────
            // Cypress com --reporter json pode gerar um JSON por spec,
            // cada um formatado em múltiplas linhas (pretty-print).
            function extrairJSONs(texto) {
              const objetos = [];
              let depth = 0;
              let inicio = -1;
              for (let i = 0; i < texto.length; i++) {
                const ch = texto[i];
                if (ch === '{') {
                  if (depth === 0) inicio = i;
                  depth++;
                } else if (ch === '}') {
                  depth--;
                  if (depth === 0 && inicio !== -1) {
                    try {
                      objetos.push(JSON.parse(texto.slice(inicio, i + 1)));
                    } catch (_) {}
                    inicio = -1;
                  }
                }
              }
              return objetos;
            }

            // ─── Extrair testes de um objeto JSON (tenta vários caminhos) ──
            function extrairTestes(obj, destino) {
              // Path 1: obj.tests (array direto de testes)
              if (Array.isArray(obj.tests)) {
                for (const t of obj.tests) {
                  if (t.state === 'failed') destino.push(t);
                }
              }
              // Path 2: obj.failures (array de testes que falharam)
              if (Array.isArray(obj.failures)) {
                for (const t of obj.failures) destino.push(t);
              }
              // Path 3: obj.results[].suites[].tests[]
              if (Array.isArray(obj.results)) {
                for (const r of obj.results) {
                  if (Array.isArray(r.tests)) {
                    for (const t of r.tests) {
                      if (t.state === 'failed') destino.push(t);
                    }
                  }
                  if (Array.isArray(r.suites)) {
                    const percorrer = (suites) => {
                      for (const s of suites) {
                        if (Array.isArray(s.tests)) {
                          for (const t of s.tests) {
                            if (t.state === 'failed') destino.push(t);
                          }
                        }
                        if (Array.isArray(s.suites)) percorrer(s.suites);
                      }
                    };
                    percorrer(r.suites);
                  }
                }
              }
            }

            // ─── Tentar parsear ──────────────────────────────────────────
            const raw = fs.existsSync('cypress-results.json')
              ? fs.readFileSync('cypress-results.json', 'utf8').replace(/\u001b\[.*?m/g, '')
              : '';

            const failedTests = [];
            const errorMessages = [];

            // Tenta 1: arquivo inteiro é um JSON único
            try {
              const unico = JSON.parse(raw);
              extrairTestes(unico, failedTests);
            } catch (_) {
              // Tenta 2: múltiplos JSON no arquivo
              const objetos = extrairJSONs(raw);
              for (const obj of objetos) {
                extrairTestes(obj, failedTests);
              }
            }

            // Monta as strings de saída
            for (const t of failedTests) {
              const nome = Array.isArray(t.title)
                ? t.title.join(' > ')
                : (t.fullTitle || t.title || 'Teste desconhecido');
              const erro = t.displayError || t.err?.message || '';
              if (erro) errorMessages.push(erro.split('\n')[0]);
            }

            // ─── Verificar duplicatas ────────────────────────────────────
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,qa'
            });

            const date = new Date().toISOString().split('T')[0];
            const title = `Falha nos testes E2E — ${date}`;

            if (issues.some(i => i.title.includes('Falha nos testes E2E'))) {
              console.log('Issue já existe. Pulando criação.');
              return;
            }

            // ─── Montar body ─────────────────────────────────────────────
            const body = [
              '## ❌ Testes E2E falharam\n',
              `**Branch:** ${context.ref}`,
              `**Commit:** ${context.sha}`,
              '',
              '---',
            ];

            if (failedTests.length > 0) {
              body.push(`\n### Testes com falha (${failedTests.length})`);
              for (const t of failedTests) {
                const nome = Array.isArray(t.title)
                  ? t.title.join(' > ')
                  : (t.fullTitle || t.title || 'Teste desconhecido');
                body.push(`- ❌ **${nome}**`);
              }
            }

            if (errorMessages.length > 0) {
              body.push('\n### Mensagens de erro');
              body.push('```');
              body.push(...errorMessages.slice(0, 20));
              body.push('```');
            }

            if (failedTests.length === 0 && errorMessages.length === 0) {
              body.push('\n> Não foi possível extrair detalhes automaticamente.');
            }

            body.push(
              '',
              '---',
              `📎 Verifique o log completo: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Issue gerada automaticamente pelo CI._'
            );

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body.join('\n'),
              labels: ['bug', 'qa']
            });

      - name: Falhar o job se testes falharam
        if: steps.cypress.outcome == 'failure'
        run: exit 1
